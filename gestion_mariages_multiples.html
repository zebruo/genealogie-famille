<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Mariages Multiples</title>
    <link rel="stylesheet" href="styles/family-tree-styles.css" />
    <link rel="stylesheet" href="styles/readonly.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        .person-card {
            background: var(--form-section-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
        }

        .person-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .person-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .person-info i {
            font-size: 1.5rem;
            color: var(--button-bg);
        }

        .person-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .person-id {
            font-size: 0.85rem;
            margin-left: 10px;
        }

        .marriage-count {
            background: var(--button-bg);
            color: var(--button-text);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .marriages-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .marriage-item {
            background: var(--bg-color);
            border: 2px solid var(--input-border);
            border-radius: var(--radius-sm);
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: all var(--transition-fast);
        }

        .marriage-item:hover {
            border-color: var(--button-bg);
        }

        .marriage-order {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .order-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .order-input {
            width: 50px;
            padding: 8px;
            border: 2px solid var(--input-border);
            border-radius: var(--radius-sm);
            text-align: center;
            color: var(--button-bg);
            font-size: 1rem;
            font-weight: 700;
            background: var(--bg-color);
        }

        .order-input:focus {
            border-color: var(--button-bg);
            outline: none;
            box-shadow: 0 0 0 2px rgba(69, 183, 175, 0.2);
        }

        .marriage-details {
            flex: 1;
        }

        .spouse-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spouse-name i {
            color: var(--button-bg);
        }

        .marriage-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
        }

        .marriage-actions {
            display: flex;
            gap: 8px;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .success {
            background: #4caf50;
            color: white;
            padding: 15px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
        }

        .no-data i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-data h2 {
            margin: 0 0 10px 0;
        }

        @media (max-width: 768px) {
             h3 {font-size: 0.8rem; }

            .person-id { display: none; }

            .person-card { padding: 10px; }

            .person-header { gap: 6px; flex-direction: column; }

            .person-name { font-size: 0.7rem; }

            .marriage-count {
                font-size: 0.65rem;
                padding: 4px 10px;
            }

            .marriage-item {
                flex-wrap: nowrap;
                align-items: center;
                gap: 8px;
                padding: 8px;
            }

            .order-label { display: none; }

            .order-input {
                width: 36px;
                padding: 4px;
                font-size: 0.85rem;
            }

            .marriage-details { min-width: 0; }

            .spouse-name {
                font-size: 0.7rem;
                margin-bottom: 4px;
            }

            .marriage-info {
                font-size: 0.72rem;
                gap: 6px;
            }

            .panel-info-item {
                border-bottom: none;
                padding: 0;
            }

            .marriage-actions .action-button {
                font-size: 0.8rem;
                padding: 6px 10px;
                min-width: unset;
            }

            .marriage-actions .action-button i {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
  <!-- Menu de navigation chargé dynamiquement depuis menu-navigation-users.html -->
  <!-- Le script menu-loader.js est chargé à la fin du fichier avant darkMode.js et burger.js -->
    <div class="container">
        <div class="controls-header">
            <div class="controls-title">
                <i class="fas fa-ring"></i>
                Gestion des Mariages Multiples
        </div>
            <button class="action-button admin-only" onclick="location.reload()">
                <i class="fas fa-sync"></i>
                Actualiser
            </button>
        </div>

        <div id="message-container"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Personnes concernées</h3>
                <div class="stat-number" id="stat-persons">0</div>
            </div>
            <div class="stat-card">
                <h3>Total de mariages</h3>
                <div class="stat-number" id="stat-marriages">0</div>
            </div>
            <div class="stat-card">
                <h3>Modifications en attente</h3>
                <div class="stat-number" id="stat-pending">0</div>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                Chargement des données...
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/menu-loader.js" data-menu="menu-navigation-users.html"></script>
    <script src="js/darkMode.js"></script>
    <script src="js/burger.js"></script>
    <script>
        let familyData = {};
        let pendingChanges = new Set();

        // Charger les données depuis l'API
        async function loadData() {
            try {
                const response = await fetch('admin/api3.php?action=getFamilyData');
                if (!response.ok) throw new Error('Erreur lors du chargement des données');
                
                familyData = await response.json();
                displayMultipleMarriages();
            } catch (error) {
                showError('Erreur lors du chargement des données: ' + error.message);
            }
        }

        // Filtrer les personnes avec mariages multiples
        function getPersonsWithMultipleMarriages() {
            const personsWithMultipleMarriages = [];
            
            for (const [personId, person] of Object.entries(familyData)) {
                if (person.spouseIds && person.spouseIds.length > 1) {
                    const marriages = [];
                    
                    person.spouseIds.forEach(spouseId => {
                        const marriageData = person.marriages && person.marriages[spouseId] 
                            ? person.marriages[spouseId] 
                            : {};
                        
                        const spouse = familyData[spouseId];
                        if (spouse) {
                            marriages.push({
                                spouseId: spouseId,
                                spouseName: `${spouse.firstNames} ${spouse.lastName}`,
                                spouseSex: spouse.sex,
                                spouseDeathDate: spouse.fullDeathDate || '',
                                marriageId: marriageData.marriageId,
                                numeroOrdre: marriageData.numeroOrdre || 1,
                                dateMarriage: marriageData.fullMarriageDate || '',
                                lieuMarriage: marriageData.marriagePlace || '',
                                dateDivorce: marriageData.fullDivorceDate || '',
                                hasDivorce: marriageData.hasDivorce || false,
                                endType: marriageData.endType || ''
                            });
                        }
                    });
                    
                    // Trier les mariages par numero_ordre
                    marriages.sort((a, b) => a.numeroOrdre - b.numeroOrdre);
                    
                    personsWithMultipleMarriages.push({
                        id: personId,
                        name: `${person.firstNames} ${person.lastName}`,
                        sex: person.sex,
                        deathDate: person.fullDeathDate || '',
                        marriages: marriages
                    });
                }
            }
            
            // Trier par nom
            personsWithMultipleMarriages.sort((a, b) => a.name.localeCompare(b.name));
            
            return personsWithMultipleMarriages;
        }

        // Afficher les personnes avec mariages multiples
        function displayMultipleMarriages() {
            const persons = getPersonsWithMultipleMarriages();
            const contentDiv = document.getElementById('content');
            
            // Mettre à jour les statistiques
            const totalMarriages = persons.reduce((sum, p) => sum + p.marriages.length, 0);
            document.getElementById('stat-persons').textContent = persons.length;
            document.getElementById('stat-marriages').textContent = totalMarriages;
            document.getElementById('stat-pending').textContent = pendingChanges.size;
            
            if (persons.length === 0) {
                contentDiv.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-ring"></i>
                        <h2>Aucun mariage multiple trouvé</h2>
                        <p>Toutes les personnes ont au maximum un mariage.</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            persons.forEach(person => {
                html += `
                    <div class="person-card" data-person-id="${person.id}">
                        <div class="person-header">
                            <div class="person-info">
                                <i class="fas fa-user"></i>
                                <div>
                                    <span class="person-name">${person.name}</span>
                                    <span class="person-id">(ID: ${person.id})</span>
                                </div>
                            </div>
                            <div class="marriage-count">
                                ${person.marriages.length} mariage${person.marriages.length > 1 ? 's' : ''}
                            </div>
                        </div>
                        <div class="marriages-list">
                `;
                
                person.marriages.forEach(marriage => {
                    // Déterminer le statut du mariage
                    let statusBadge = '';
                    let statusInfo = '';
                    
                    if (marriage.dateDivorce && marriage.dateDivorce === marriage.spouseDeathDate) {
                        // Le mariage s'est terminé par le décès du conjoint
                        const spouseLabel = marriage.spouseSex === 'M' ? 'son mari le' : 'son épouse le';
                        statusBadge = '<span class="lieu-badge badge-deces">Décès</span>';
                        statusInfo = `
                            <div class="panel-info-item">
                                <i class="fas fa-cross"></i>
                                de ${spouseLabel} : ${marriage.spouseDeathDate}
                            </div>
                        `;
                    } else if (marriage.dateDivorce && marriage.dateDivorce === person.deathDate) {
                        // Le mariage s'est terminé par le décès de la personne
                        const personLabel = person.sex === 'M' ? 'Décédé' : 'Décédée';
                        statusBadge = '<span class="lieu-badge badge-deces"><i class="fas fa-cross"></i> Décès</span>';
                        statusInfo = `
                            <div class="panel-info-item">
                                <i class="fas fa-cross"></i>
                                ${personLabel} le: ${person.deathDate}
                            </div>
                        `;
                    } else if (marriage.hasDivorce && !marriage.dateDivorce) {
                        // Divorce sans date
                        const divorceLabel = person.sex === 'F' ? 'Divorcée' : 'Divorcé';
                        statusBadge = `<span class="lieu-badge badge-fratrie">${divorceLabel}</span>`;
                    } else if (marriage.dateDivorce) {
                        // Divorce avec date
                        const divorceLabel = person.sex === 'F' ? 'Divorcée' : 'Divorcé';
                        statusBadge = `<span class="lieu-badge badge-fratrie">${divorceLabel}</span>`;
                        statusInfo = `
                            <div class="panel-info-item">
                                le : ${marriage.dateDivorce}
                            </div>
                        `;
                    } else {
                        // Mariage actif
                        statusBadge = '<span class="lieu-badge badge-mariage">Mariage</span>';
                    }
                    
                    html += `
                        <div class="marriage-item" data-marriage-id="${marriage.marriageId}">
                            <div class="marriage-order">
                                <span class="order-label">Ordre</span>
                                ${window.userRole !== 'viewer' ? `
                                <input
                                    type="number"
                                    class="order-input"
                                    value="${marriage.numeroOrdre}"
                                    min="1"
                                    max="10"
                                    data-marriage-id="${marriage.marriageId}"
                                    data-original-value="${marriage.numeroOrdre}"
                                    onchange="handleOrderChange(this)"
                                />` : `<span class="order-input" style="cursor:default;">${marriage.numeroOrdre}</span>`}
                            </div>
                            <div class="marriage-details">
                                <div class="spouse-name">
                                    ${marriage.spouseName}
                                    ${marriage.spouseDeathDate ? '<i class="fas fa-cross" style="color: #607d8b; margin-left: 8px;" title="Décédé(e)"></i>' : ''}
                                </div>
                                <div class="marriage-info">
                                    ${marriage.dateMarriage ? `
                                        <div class="panel-info-item">
                                            <i class="fas fa-ring"></i>
                                            ${marriage.dateMarriage}
                                        </div>
                                    ` : ''}
                                    ${marriage.lieuMarriage ? `
                                        <div class="panel-info-item">
                                            <i class="fas fa-map-marker-alt"></i>
                                            ${marriage.lieuMarriage}
                                        </div>
                                    ` : ''}
                                    ${statusBadge}
                                    ${statusInfo}
                                </div>
                            </div>
                            ${window.userRole !== 'viewer' ? `
                            <div class="marriage-actions">
                                <button
                                    class="action-button"
                                    onclick="saveMarriageOrder(${marriage.marriageId})"
                                    disabled
                                    id="btn-save-${marriage.marriageId}"
                                >
                                    <i class="fas fa-save"></i>
                                    Enregistrer
                                </button>
                            </div>` : ''}
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            contentDiv.innerHTML = html;
        }

        // Gérer le changement de numéro d'ordre
        function handleOrderChange(input) {
            const marriageId = input.dataset.marriageId;
            const originalValue = parseInt(input.dataset.originalValue);
            const newValue = parseInt(input.value);
            
            const saveBtn = document.getElementById(`btn-save-${marriageId}`);
            
            if (newValue !== originalValue && newValue >= 1) {
                saveBtn.disabled = false;
                pendingChanges.add(marriageId);
            } else {
                saveBtn.disabled = true;
                pendingChanges.delete(marriageId);
            }
            
            document.getElementById('stat-pending').textContent = pendingChanges.size;
        }

        // Enregistrer le nouveau numéro d'ordre
        async function saveMarriageOrder(marriageId) {
            const input = document.querySelector(`input[data-marriage-id="${marriageId}"]`);
            const newOrder = parseInt(input.value);
            
            if (newOrder < 1) {
                showError('Le numéro d\'ordre doit être supérieur ou égal à 1');
                return;
            }
            
            const saveBtn = document.getElementById(`btn-save-${marriageId}`);
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';
            
            try {
                const formData = new FormData();
                formData.append('action', 'updateMariageOrder');
                formData.append('mariage_id', marriageId);
                formData.append('numero_ordre', newOrder);
                
                const response = await fetch('admin/api3.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess('Numéro d\'ordre mis à jour avec succès');
                    input.dataset.originalValue = newOrder;
                    pendingChanges.delete(marriageId.toString());
                    document.getElementById('stat-pending').textContent = pendingChanges.size;
                    
                    // Recharger les données pour mettre à jour l'affichage
                    setTimeout(() => loadData(), 1000);
                } else {
                    throw new Error(result.message || 'Erreur lors de la mise à jour');
                }
            } catch (error) {
                showError('Erreur lors de l\'enregistrement: ' + error.message);
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
            }
        }

        // Afficher un message d'erreur
        function showError(message) {
            const container = document.getElementById('message-container');
            container.innerHTML = `
                <div class="error">
                    <i class="fas fa-exclamation-triangle"></i>
                    ${message}
                </div>
            `;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        // Afficher un message de succès
        function showSuccess(message) {
            const container = document.getElementById('message-container');
            container.innerHTML = `
                <div class="success">
                    <i class="fas fa-check-circle"></i>
                    ${message}
                </div>
            `;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        // Charger les données au démarrage
        loadData();
    </script>
</body>
</html>
